name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, claude/modest-newton-2yn4zc]
  workflow_dispatch:
  # Refresh automated signals every three hours.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch signals
        env:
          PREV_SIGNALS_URL: ${{ steps.pages.outputs.base_url }}/data/signals.json
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: node scripts/fetch-signals.js
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
